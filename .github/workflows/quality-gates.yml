name: quality-gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-core-gates:
    name: prepare core gate contract
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - id: matrix
        name: Validate and expand the core gate contract
        shell: bash
        run: |
          uv run --with pyyaml python -m ci.run validate --source-root "$GITHUB_WORKSPACE"
          uv run python -m ci.run list --json --group core --source-root "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/core-gates.json"
          uv run python -c 'import json, sys; gates = json.load(open(sys.argv[1], encoding="utf-8"))["core"]; cells = [{"gate": gate, "suite": gate["id"], "os": os} for gate in gates for os in gate["os"]]; print("matrix=" + json.dumps({"include": cells}, separators=(",", ":")))' "$RUNNER_TEMP/core-gates.json" >> "$GITHUB_OUTPUT"

  core-gates:
    name: >-
      ${{ matrix.gate.id == 'lint' && 'ruff + mypy (incl. complexity)' || matrix.gate.id == 'types' && 'ruff + mypy (incl. complexity)' || matrix.gate.id == 'coverage' && 'coverage (branch, ratcheted floor)' || format('{0} · {1}', matrix.suite, matrix.os) }}
    needs: prepare-core-gates
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-core-gates.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run ${{ matrix.gate.id }} gate
        run: >
          uv run python -m ci.run run ${{ matrix.gate.id }}
          --source-root "$GITHUB_WORKSPACE"
          --expected-source-sha "${{ github.sha }}"
          --workflow-repo "${{ github.repository }}"
          --workflow-sha "${{ github.sha }}"
          --source-repo "${{ github.repository }}"
